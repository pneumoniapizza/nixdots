[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
preview_hovered = { bg = "{{colors.surface_container_high.default.hex}}" }
find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_copied = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
tab_active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
unset_main  = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[status]
overall = { bg = "{{colors.surface_container.default.hex}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.secondary.default.hex}}" }
perm_sep   = { fg = "{{colors.outline.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
selected = { reversed = true }

[select]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[which]
cols = 3
mask = { bg = "{{colors.surface_container.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
rest = { fg = "{{colors.outline.default.hex}}" }
desc = { fg = "{{colors.on_surface_variant.default.hex}}" }
separator = "  "

[filetype]
rules = [
  { name = "*/", fg = "{{colors.primary.default.hex}}" },
  { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "{video,audio}/*", fg = "{{colors.secondary.default.hex}}" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", fg = "{{colors.error.default.hex}}" },
  { name = "*", is = "orphan", fg = "{{colors.error.default.hex}}" },
  { name = "*", is = "exec", fg = "{{colors.secondary.default.hex}}" },
]
