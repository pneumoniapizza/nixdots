# matugen template → ~/.config/tmux/matugen-colors.conf
# palette used by the statusline in home/terminal/tmux/default.nix, plus static styles

set -g @c_primary "{{colors.primary.default.hex}}"
set -g @c_on_primary "{{colors.on_primary.default.hex}}"
set -g @c_secondary "{{colors.secondary.default.hex}}"
set -g @c_on_secondary "{{colors.on_secondary.default.hex}}"
set -g @c_tertiary "{{colors.tertiary.default.hex}}"
set -g @c_on_tertiary "{{colors.on_tertiary.default.hex}}"
set -g @c_bar "{{colors.surface_container.default.hex}}"
set -g @c_seg "{{colors.surface_container_high.default.hex}}"
set -g @c_dim "{{colors.on_surface_variant.default.hex}}"
set -g @c_outline "{{colors.outline.default.hex}}"

set -g status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-style "fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g window-status-activity-style "fg={{colors.tertiary.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g window-status-bell-style "fg={{colors.error.default.hex}},bg={{colors.surface_container.default.hex}},bold"

set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.secondary.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"

set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.primary.default.hex}}"
set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
set -g clock-mode-colour "{{colors.primary.default.hex}}"
set -g menu-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g menu-selected-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g menu-border-style "fg={{colors.outline_variant.default.hex}}"
set -g popup-style "bg={{colors.surface_container_low.default.hex}}"
set -g popup-border-style "fg={{colors.outline_variant.default.hex}}"
