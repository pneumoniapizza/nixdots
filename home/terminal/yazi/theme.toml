[mgr]
cwd = { fg = "#c4a7e7", bold = true }
hovered = { fg = "#c4a7e7", bg = "#493f5b" }
preview_hovered = { bg = "#26233a" }
find_keyword = { fg = "#ebbcba", bold = true, underline = true }
find_position = { fg = "#9ccfd8" }
marker_selected = { fg = "#c4a7e7", bg = "#c4a7e7" }
marker_copied = { fg = "#ebbcba", bg = "#ebbcba" }
marker_cut = { fg = "#eb6f92", bg = "#eb6f92" }
marker_marked = { fg = "#9ccfd8", bg = "#9ccfd8" }
border_style = { fg = "#403d52" }

# rounded cursor: pill ends around the hovered row
[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "\ue0b6", close = "\ue0b4" }

[tabs]
active = { fg = "#191724", bg = "#c4a7e7" }
inactive = { fg = "#908caa", bg = "#1f1d2e" }

[mode]
normal_main = { fg = "#191724", bg = "#c4a7e7", bold = true }
normal_alt  = { fg = "#c4a7e7", bg = "#26233a" }
select_main = { fg = "#191724", bg = "#9ccfd8", bold = true }
select_alt  = { fg = "#9ccfd8", bg = "#26233a" }
unset_main  = { fg = "#191724", bg = "#ebbcba", bold = true }
unset_alt   = { fg = "#ebbcba", bg = "#26233a" }

[status]
overall = { bg = "#1f1d2e" }
perm_type  = { fg = "#c4a7e7" }
perm_read  = { fg = "#ebbcba" }
perm_write = { fg = "#eb6f92" }
perm_exec  = { fg = "#9ccfd8" }
perm_sep   = { fg = "#6e6a86" }

[input]
border = { fg = "#c4a7e7" }
border_set = { as = "plain" }
selected = { reversed = true }

[pick]
border = { fg = "#c4a7e7" }
border_set = { as = "plain" }
active = { fg = "#c4a7e7", bold = true }

[tasks]
border = { fg = "#c4a7e7" }
border_set = { as = "plain" }
hovered = { fg = "#c4a7e7", bg = "#493f5b" }

[which]
cols = 3
mask = { bg = "#1f1d2e" }
cand = { fg = "#c4a7e7" }
rest = { fg = "#6e6a86" }
desc = { fg = "#908caa" }
separator = "  "

[filetype]
rules = [
  { url = "*/", fg = "#c4a7e7", bold = true },
  { mime = "image/*", fg = "#ebbcba" },
  { mime = "{video,audio}/*", fg = "#9ccfd8" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", fg = "#eb6f92" },
  { url = "*", is = "orphan", fg = "#eb6f92" },
  { url = "*", is = "exec", fg = "#9ccfd8" },
]

[icon]
prepend_conds = [
  { "if" = "dir", text = "\uf07b", fg = "#c4a7e7" },
]
