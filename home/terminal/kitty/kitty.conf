# ── colors (rose-pine) ────────────────────────────────────────
foreground                #e0def4
background                #191724
selection_foreground      #e0def4
selection_background      #403d52

cursor                    #c4a7e7
cursor_text_color         #191724

url_color                 #c4a7e7

active_border_color       #c4a7e7
inactive_border_color     #403d52
bell_border_color         #eb6f92
visual_bell_color         #26233a

# tab bar
tab_bar_background        #1f1d2e
active_tab_foreground     #191724
active_tab_background     #c4a7e7
inactive_tab_foreground   #908caa
inactive_tab_background   #26233a

# marks (ctrl+shift+f2 etc.)
mark1_foreground          #191724
mark1_background          #c4a7e7
mark2_foreground          #191724
mark2_background          #9ccfd8
mark3_foreground          #191724
mark3_background          #ebbcba

# ansi: normal
color0                    #26233a
color1                    #eb6f92
color2                    #31748f
color3                    #f6c177
color4                    #9ccfd8
color5                    #c4a7e7
color6                    #ebbcba
color7                    #e0def4

# ansi: bright
color8                    #6e6a86
color9                    #eb6f92
color10                   #31748f
color11                   #f6c177
color12                   #9ccfd8
color13                   #c4a7e7
color14                   #ebbcba
color15                   #e0def4

# ── font ──────────────────────────────────────────────────────
font_family               family="JetBrainsMono Nerd Font" style="Regular"
bold_font                 family="JetBrainsMono Nerd Font" style="Bold"
italic_font               family="JetBrainsMono Nerd Font" style="Regular"
bold_italic_font          family="JetBrainsMono Nerd Font" style="Bold"
font_size                 16.0
disable_ligatures         cursor
modify_font               cell_height 105%

# ── cursor + animations ───────────────────────────────────────
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_shape_unfocused    hollow
cursor_blink_interval     0.6 ease-in-out
cursor_stop_blinking_after 20

# smooth glide between cursor positions
cursor_trail              3
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2

# soft fade instead of a flash on bell
enable_audio_bell         no
visual_bell_duration      0.25 ease-out
window_alert_on_bell      yes
bell_on_tab               "● "

# ── window ────────────────────────────────────────────────────
background_opacity        1.00
dynamic_background_opacity yes
window_padding_width      20 20
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      110c
initial_window_height     32c

draw_minimal_borders      yes
window_border_width       1pt
inactive_text_alpha       0.75
placement_strategy        center

# ── tab bar ───────────────────────────────────────────────────
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_bar_margin_height     6 0
tab_title_max_length      24
tab_title_template        " {index} {title} "
active_tab_title_template " {index} {title}{' ●' if layout_name == 'stack' else ''} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# ── scrollback / behavior ─────────────────────────────────────
shell                     fish
scrollback_lines          10000
copy_on_select            clipboard
strip_trailing_spaces     smart
mouse_hide_wait           2.0
url_style                 curly
open_url_with             default
detect_urls               yes
shell_integration         enabled
allow_remote_control      socket-only
listen_on                 unix:/tmp/kitty-{kitty_pid}

# ── performance ───────────────────────────────────────────────
repaint_delay             6
input_delay               1
sync_to_monitor           yes

# ── keys ──────────────────────────────────────────────────────
map ctrl+alt+bracketright set_background_opacity +0.05
map ctrl+alt+bracketleft  set_background_opacity -0.05
map ctrl+alt+backslash    set_background_opacity default

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Window splits 
map ctrl+shift+enter      launch --location=vsplit --cwd=current
map ctrl+shift+backslash  launch --location=hsplit --cwd=current

# Switch active panes (Vim-style directionals)
map ctrl+shift+h          neighboring_window left
map ctrl+shift+j          neighboring_window down
map ctrl+shift+k          neighboring_window up
map ctrl+shift+l          neighboring_window right

# Resize panes (Vim-style directionals with ctrl+alt)
map ctrl+alt+h            resize_window narrower
map ctrl+alt+j            resize_window shorter
map ctrl+alt+k            resize_window taller
map ctrl+alt+l            resize_window wider

# Pane management
map ctrl+shift+w          close_window
map ctrl+alt+0            reset_window_sizes

map ctrl+shift+z          toggle_layout stack

enabled_layouts           splits:split_axis=horizontal,stack
map ctrl+shift+r          load_config_file
